<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" font-family="'Courier New', monospace">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0d1117"/>

  <!-- NDC boundary square: NDC(-1,-1)→SVG(70,430), NDC(1,1)→SVG(430,70) -->
  <!-- Center SVG(250,250), scale 180px per NDC unit -->

  <!-- Subtle grid lines at ±0.5 -->
  <!-- x=-0.5 → svg_x=250-90=160, x=0.5 → svg_x=340 -->
  <!-- y=-0.5 → svg_y=250+90=340, y=0.5 → svg_y=160 -->
  <line x1="160" y1="70" x2="160" y2="430" stroke="#161b22" stroke-width="1.5"/>
  <line x1="340" y1="70" x2="340" y2="430" stroke="#161b22" stroke-width="1.5"/>
  <line x1="70" y1="160" x2="430" y2="160" stroke="#161b22" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="430" y2="340" stroke="#161b22" stroke-width="1.5"/>

  <!-- NDC square -->
  <rect x="70" y="70" width="360" height="360" fill="#0d1f33" stroke="#1d4ed8" stroke-width="2.5" rx="2"/>

  <!-- X axis -->
  <line x1="22" y1="250" x2="478" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Y axis -->
  <line x1="250" y1="478" x2="250" y2="22" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- X tick marks at -1, -0.5, 0.5, 1 -->
  <line x1="70"  y1="243" x2="70"  y2="257" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="160" y1="246" x2="160" y2="254" stroke="#374151" stroke-width="1"/>
  <line x1="340" y1="246" x2="340" y2="254" stroke="#374151" stroke-width="1"/>
  <line x1="430" y1="243" x2="430" y2="257" stroke="#4b5563" stroke-width="1.5"/>
  <!-- Y tick marks -->
  <line x1="243" y1="70"  x2="257" y2="70"  stroke="#4b5563" stroke-width="1.5"/>
  <line x1="246" y1="160" x2="254" y2="160" stroke="#374151" stroke-width="1"/>
  <line x1="246" y1="340" x2="254" y2="340" stroke="#374151" stroke-width="1"/>
  <line x1="243" y1="430" x2="257" y2="430" stroke="#4b5563" stroke-width="1.5"/>

  <!-- X tick labels -->
  <text x="70"  y="270" text-anchor="middle" fill="#6b7280" font-size="12">−1</text>
  <text x="160" y="266" text-anchor="middle" fill="#4b5563" font-size="10">−½</text>
  <text x="340" y="266" text-anchor="middle" fill="#4b5563" font-size="10">½</text>
  <text x="430" y="270" text-anchor="middle" fill="#6b7280" font-size="12">1</text>
  <!-- Y tick labels -->
  <text x="228" y="74"  text-anchor="end" fill="#6b7280" font-size="12">1</text>
  <text x="232" y="164" text-anchor="end" fill="#4b5563" font-size="10">½</text>
  <text x="228" y="344" text-anchor="end" fill="#4b5563" font-size="10">−½</text>
  <text x="228" y="434" text-anchor="end" fill="#6b7280" font-size="12">−1</text>

  <!-- Axis labels -->
  <text x="485" y="254" fill="#9ca3af" font-size="14" font-weight="bold">X</text>
  <text x="244" y="15"  fill="#9ca3af" font-size="14" font-weight="bold">Y</text>

  <!-- Origin -->
  <circle cx="250" cy="250" r="4" fill="#fbbf24"/>
  <text x="258" y="244" fill="#fbbf24" font-size="11">(0, 0)</text>

  <!-- Corner markers and labels -->
  <circle cx="70" cy="70" r="5" fill="#f87171"/>
  <rect x="74" y="72" width="62" height="28" fill="#1f0a0a" rx="3" opacity="0.85"/>
  <text x="105" y="82"  text-anchor="middle" fill="#fca5a5" font-size="10">(−1, 1)</text>
  <text x="105" y="94"  text-anchor="middle" fill="#f87171" font-size="9">top-left</text>

  <circle cx="430" cy="70" r="5" fill="#f87171"/>
  <rect x="366" y="72" width="58" height="28" fill="#1f0a0a" rx="3" opacity="0.85"/>
  <text x="395" y="82"  text-anchor="middle" fill="#fca5a5" font-size="10">(1, 1)</text>
  <text x="395" y="94"  text-anchor="middle" fill="#f87171" font-size="9">top-right</text>

  <circle cx="70" cy="430" r="5" fill="#f87171"/>
  <rect x="74" y="404" width="66" height="28" fill="#1f0a0a" rx="3" opacity="0.85"/>
  <text x="107" y="414" text-anchor="middle" fill="#fca5a5" font-size="10">(−1,−1)</text>
  <text x="107" y="426" text-anchor="middle" fill="#f87171" font-size="9">bot-left</text>

  <circle cx="430" cy="430" r="5" fill="#f87171"/>
  <rect x="362" y="404" width="62" height="28" fill="#1f0a0a" rx="3" opacity="0.85"/>
  <text x="393" y="414" text-anchor="middle" fill="#fca5a5" font-size="10">(1,−1)</text>
  <text x="393" y="426" text-anchor="middle" fill="#f87171" font-size="9">bot-right</text>

  <!-- Sample particles scattered inside the square -->
  <circle cx="144" cy="133" r="3.5" fill="#60a5fa" opacity="0.9"/>
  <circle cx="176" cy="314" r="3"   fill="#a78bfa" opacity="0.9"/>
  <circle cx="370" cy="168" r="3.5" fill="#34d399" opacity="0.9"/>
  <circle cx="316" cy="388" r="3"   fill="#fb923c" opacity="0.9"/>
  <circle cx="110" cy="368" r="3"   fill="#f472b6" opacity="0.9"/>
  <circle cx="398" cy="307" r="3.5" fill="#facc15" opacity="0.9"/>
  <circle cx="274" cy="122" r="3"   fill="#60a5fa" opacity="0.7"/>
  <circle cx="94"  cy="211" r="3"   fill="#34d399" opacity="0.7"/>
  <circle cx="392" cy="393" r="3"   fill="#a78bfa" opacity="0.7"/>
  <circle cx="314" cy="148" r="3"   fill="#fb923c" opacity="0.7"/>
  <circle cx="118" cy="280" r="3"   fill="#f87171" opacity="0.7"/>
  <circle cx="362" cy="272" r="3"   fill="#60a5fa" opacity="0.7"/>

  <!-- Caption -->
  <text x="250" y="490" text-anchor="middle" fill="#4b5563" font-family="sans-serif" font-size="11">NDC — all coordinates live in [−1, +1] regardless of window size</text>
</svg>
