<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Courier New', monospace">
  <defs>
    <marker id="ax"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4b5563"/>
    </marker>
    <marker id="big" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="340" fill="#0d1117"/>

  <!-- ── LEFT PANEL: Pixel / View space ─────────────────────────────── -->
  <!-- Panel: x=15..265, y=35..285 (250×250) -->
  <rect x="15" y="35" width="250" height="250" fill="#111827" stroke="#374151" stroke-width="1.5" rx="4"/>
  <text x="140" y="24" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="bold">View / Pixel Space</text>

  <!-- Pixel axes (AppKit: origin at bottom-left, y increases upward) -->
  <!-- SVG(15,285) = pixel(0,0)  SVG(265,35) = pixel(800,600) -->
  <line x1="15"  y1="285" x2="15"  y2="37"  stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="15"  y1="285" x2="263" y2="285" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>

  <!-- Corner labels -->
  <text x="18"  y="50"  fill="#4b5563" font-size="9">(0, 600)</text>
  <text x="18"  y="279" fill="#4b5563" font-size="9">(0, 0)</text>
  <text x="195" y="279" fill="#4b5563" font-size="9">(800, 0)</text>
  <text x="175" y="50"  fill="#4b5563" font-size="9">(800, 600)</text>

  <!-- Edge tick labels -->
  <text x="6"   y="289" fill="#6b7280" font-size="10">0</text>
  <text x="252" y="298" fill="#6b7280" font-size="10">800 px</text>
  <text x="5"   y="46"  fill="#6b7280" font-size="10">600</text>

  <!-- Sample point: pixel (400,300) = center of 800×600 window -->
  <!-- svg_x = 15 + (400/800)*250 = 15+125 = 140 -->
  <!-- svg_y = 285 - (300/600)*250 = 285-125 = 160 -->
  <line x1="140" y1="160" x2="140" y2="285" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="15"  y1="160" x2="140" y2="160" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <circle cx="140" cy="160" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="148" y="153" fill="#fbbf24" font-size="10">(400, 300)</text>

  <!-- ── MIDDLE: formula + arrow ─────────────────────────────────────── -->
  <!-- Arrow from ~x=270 to ~x=425, at y=160 -->
  <line x1="272" y1="160" x2="422" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#big)"/>

  <!-- Formula box -->
  <rect x="272" y="172" width="150" height="72" fill="#0d1f33" stroke="#1e40af" stroke-width="1" rx="4"/>
  <text x="347" y="188" text-anchor="middle" fill="#93c5fd" font-size="10">x_ndc = x / w × 2 − 1</text>
  <text x="347" y="204" text-anchor="middle" fill="#93c5fd" font-size="10">y_ndc = y / h × 2 − 1</text>
  <line x1="282" y1="210" x2="412" y2="210" stroke="#1e3a5f" stroke-width="1"/>
  <text x="347" y="222" text-anchor="middle" fill="#6b7280" font-size="9">w = window width</text>
  <text x="347" y="234" text-anchor="middle" fill="#6b7280" font-size="9">h = window height</text>

  <!-- Worked example -->
  <rect x="272" y="252" width="150" height="52" fill="#052e16" stroke="#14532d" stroke-width="1" rx="4"/>
  <text x="347" y="267" text-anchor="middle" fill="#86efac" font-size="9">400 / 800 × 2 − 1 = 0</text>
  <text x="347" y="280" text-anchor="middle" fill="#86efac" font-size="9">300 / 600 × 2 − 1 = 0</text>
  <text x="347" y="295" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">→  NDC (0, 0)  ✓</text>

  <!-- ── RIGHT PANEL: NDC space ──────────────────────────────────────── -->
  <!-- Panel: x=430..685, y=35..285 (255×250) -->
  <rect x="430" y="35" width="255" height="250" fill="#111827" stroke="#374151" stroke-width="1.5" rx="4"/>
  <text x="557" y="24" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="bold">NDC Space</text>

  <!-- NDC square inside panel -->
  <!-- Center: SVG(557, 160), scale: 105px per NDC unit -->
  <!-- NDC(-1,-1) → SVG(452,265), NDC(1,1) → SVG(662,55) -->
  <rect x="452" y="55" width="210" height="210" fill="#0d1f33" stroke="#1d4ed8" stroke-width="2" rx="2"/>

  <!-- Axes -->
  <line x1="438" y1="160" x2="676" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="557" y1="272" x2="557" y2="43"  stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>

  <!-- Tick marks at ±1 -->
  <line x1="452" y1="153" x2="452" y2="167" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="662" y1="153" x2="662" y2="167" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="550" y1="55"  x2="564" y2="55"  stroke="#4b5563" stroke-width="1.5"/>
  <line x1="550" y1="265" x2="564" y2="265" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Tick labels -->
  <text x="452" y="178" text-anchor="middle" fill="#6b7280" font-size="11">−1</text>
  <text x="662" y="178" text-anchor="middle" fill="#6b7280" font-size="11">1</text>
  <text x="542" y="59"  text-anchor="end"    fill="#6b7280" font-size="11">1</text>
  <text x="542" y="269" text-anchor="end"    fill="#6b7280" font-size="11">−1</text>

  <!-- Corner labels -->
  <text x="455" y="69"  fill="#374151" font-size="9">(−1, 1)</text>
  <text x="625" y="69"  fill="#374151" font-size="9">(1, 1)</text>
  <text x="455" y="278" fill="#374151" font-size="9">(−1,−1)</text>
  <text x="625" y="278" fill="#374151" font-size="9">(1,−1)</text>

  <!-- Sample point: NDC (0,0) = SVG(557, 160) -->
  <line x1="557" y1="160" x2="557" y2="265" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="452" y1="160" x2="557" y2="160" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <circle cx="557" cy="160" r="6" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="565" y="153" fill="#fbbf24" font-size="10">(0, 0)</text>
  <text x="565" y="166" fill="#fbbf24" font-size="9">center</text>

  <!-- Bottom note -->
  <text x="350" y="325" text-anchor="middle" fill="#4b5563" font-family="sans-serif" font-size="11">
    Window center (400, 300) always maps to NDC (0, 0) — regardless of resolution
  </text>
</svg>
