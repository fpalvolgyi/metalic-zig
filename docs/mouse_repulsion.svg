<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" font-family="'Courier New', monospace">
  <defs>
    <marker id="rep" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fb923c"/>
    </marker>
    <marker id="axr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="520" fill="#0d1117"/>

  <!-- NDC boundary: NDC(-1,-1)→SVG(70,430) NDC(1,1)→SVG(430,70) -->
  <!-- Center SVG(250,250), scale 180px/unit -->
  <rect x="70" y="70" width="360" height="360" fill="#0d1f33" stroke="#1d4ed8" stroke-width="1.5" rx="2"/>

  <!-- Grid at 0 -->
  <line x1="250" y1="70"  x2="250" y2="430" stroke="#161b22" stroke-width="1"/>
  <line x1="70"  y1="250" x2="430" y2="250" stroke="#161b22" stroke-width="1"/>

  <!-- Axes -->
  <line x1="35"  y1="250" x2="465" y2="250" stroke="#374151" stroke-width="1.2" marker-end="url(#axr)"/>
  <line x1="250" y1="465" x2="250" y2="35"  stroke="#374151" stroke-width="1.2" marker-end="url(#axr)"/>

  <!-- NDC corner labels -->
  <text x="73"  y="84"  fill="#374151" font-size="9">(−1, 1)</text>
  <text x="406" y="84"  fill="#374151" font-size="9">(1, 1)</text>
  <text x="73"  y="426" fill="#374151" font-size="9">(−1,−1)</text>
  <text x="406" y="426" fill="#374151" font-size="9">(1,−1)</text>

  <!-- ── Particles OUTSIDE radius (blue, unaffected) ─────────────────── -->
  <!-- SVG = (250 + ndc_x*180,  250 - ndc_y*180) -->
  <!-- NDC(-0.1, 0.1)  → SVG(232, 232) -->
  <circle cx="232" cy="232" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(0.5, 0.3) → SVG(340, 196) -->
  <circle cx="340" cy="196" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(0.2, 0.45) → SVG(286, 169) -->
  <circle cx="286" cy="169" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(-0.2,-0.2) → SVG(214, 286) -->
  <circle cx="214" cy="286" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(0.6,-0.1) → SVG(358, 268) -->
  <circle cx="358" cy="268" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(-0.3, 0.3) → SVG(196, 196) -->
  <circle cx="196" cy="196" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(-0.5,-0.4) → SVG(160, 322) -->
  <circle cx="160" cy="322" r="4" fill="#60a5fa" opacity="0.85"/>
  <!-- NDC(0.7, 0.6) → SVG(376, 142) -->
  <circle cx="376" cy="142" r="4" fill="#60a5fa" opacity="0.7"/>

  <!-- ── Mouse cursor position: NDC(0.2, 0.1) → SVG(286, 232) ─────── -->
  <!-- Repulsion radius: 0.15 NDC = 0.15×180 = 27 SVG px -->

  <!-- Radius fill (very subtle) -->
  <circle cx="286" cy="232" r="27" fill="#ef4444" opacity="0.07"/>
  <!-- Radius dashed border -->
  <circle cx="286" cy="232" r="27" fill="none" stroke="#ef4444" stroke-width="1.5"
          stroke-dasharray="5,3" opacity="0.65"/>
  <!-- Radius label -->
  <text x="315" y="212" fill="#ef4444" font-family="sans-serif" font-size="10" opacity="0.9">radius = 0.15</text>

  <!-- ── Particles INSIDE radius (orange, being pushed away) ──────── -->

  <!-- NDC(0.3, 0.22) → SVG(304, 210), dist≈0.141 < 0.15  -->
  <!-- direction from mouse: (0.1, 0.12) → norm (0.64, 0.77) → svg dir (0.64, -0.77) -->
  <circle cx="304" cy="210" r="4.5" fill="#fb923c"/>
  <line x1="304" y1="210" x2="318" y2="196" stroke="#fb923c" stroke-width="2" marker-end="url(#rep)"/>

  <!-- NDC(0.31, 0.04) → SVG(306, 243), dist≈0.114 -->
  <!-- direction: (0.11, -0.06) → norm (0.88, -0.48) → svg dir (0.88, 0.48) -->
  <circle cx="306" cy="243" r="4.5" fill="#fb923c"/>
  <line x1="306" y1="243" x2="320" y2="251" stroke="#fb923c" stroke-width="2" marker-end="url(#rep)"/>

  <!-- NDC(0.1, 0.18) → SVG(268, 218), dist≈0.128 -->
  <!-- direction: (-0.1, 0.08) → norm (-0.78, 0.63) → svg dir (-0.78, -0.63) -->
  <circle cx="268" cy="218" r="4.5" fill="#fb923c"/>
  <line x1="268" y1="218" x2="254" y2="207" stroke="#fb923c" stroke-width="2" marker-end="url(#rep)"/>

  <!-- NDC(0.12, 0.03) → SVG(272, 245), dist≈0.108 -->
  <!-- direction: (-0.08, -0.07) → norm (-0.75, -0.66) → svg dir (-0.75, 0.66) -->
  <circle cx="272" cy="245" r="4.5" fill="#fb923c"/>
  <line x1="272" y1="245" x2="258" y2="257" stroke="#fb923c" stroke-width="2" marker-end="url(#rep)"/>

  <!-- NDC(0.24,-0.03) → SVG(293, 255), dist≈0.132 -->
  <!-- direction: (0.04, -0.13) → norm (0.29, -0.96) → svg dir (0.29, 0.96) -->
  <circle cx="293" cy="255" r="4.5" fill="#fb923c"/>
  <line x1="293" y1="255" x2="297" y2="270" stroke="#fb923c" stroke-width="2" marker-end="url(#rep)"/>

  <!-- ── Mouse cursor shape at SVG(286, 232) ──────────────────────── -->
  <!-- Classic arrow cursor, tip pointing upper-left at (282, 226) -->
  <path d="M 282 226  L 282 248  L 286 243  L 292 254  L 295 252  L 289 241  L 297 233  Z"
        fill="white" stroke="#1f2937" stroke-width="1.2" opacity="0.95"/>

  <!-- Mouse label -->
  <text x="302" y="258" fill="#e5e7eb" font-family="sans-serif" font-size="10">mouse</text>
  <text x="302" y="270" fill="#9ca3af" font-family="monospace" font-size="9">NDC (0.2, 0.1)</text>

  <!-- ── Legend ────────────────────────────────────────────────────── -->
  <rect x="70" y="446" width="360" height="58" fill="#111827" stroke="#1f2937" stroke-width="1" rx="4"/>

  <circle cx="97" cy="462" r="4" fill="#60a5fa"/>
  <text x="108" y="466" fill="#9ca3af" font-family="sans-serif" font-size="11">outside radius — velocity unchanged</text>

  <circle cx="97" cy="484" r="4.5" fill="#fb923c"/>
  <line x1="107" y1="484" x2="121" y2="476" stroke="#fb923c" stroke-width="1.8" marker-end="url(#rep)"/>
  <text x="128" y="488" fill="#9ca3af" font-family="sans-serif" font-size="11">inside radius — repulsion impulse ∝ (1 − dist/radius)</text>

  <!-- Caption -->
  <text x="250" y="516" text-anchor="middle" fill="#374151" font-family="sans-serif" font-size="10">
    Compute shader runs this logic for all 100 000 particles every frame on the GPU
  </text>
</svg>
